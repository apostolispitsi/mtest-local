<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>MTest Local</title></head><body><header><h1>MTest Local</h1><p>Offline question banks & tests</p></header><main><section id="home"><div class="actions"><button id="newBank">+ Νέα τράπεζα</button><label class="button">Εισαγωγή CSV<input id="csvFile" type="file" accept=".csv,text/csv" hidden></label><button id="exportBtn">Backup JSON</button><label class="button">Restore JSON<input id="restoreFile" type="file" accept=".json,application/json" hidden></label></div><div id="banks"></div></section><section id="bankView" hidden><button id="backBtn">← Πίσω</button><h2 id="bankTitle"></h2><div class="actions"><button id="addQuestion">+ Ερώτηση</button><button id="practiceBtn">Practice</button><button id="examBtn">Exam</button></div><div id="questions"></div></section><section id="quizView" hidden><div class="quiz-head"><button id="quitQuiz">← Έξοδος</button><strong id="progress"></strong></div><h2 id="quizQuestion"></h2><div id="quizOptions"></div><div class="quiz-nav"><button id="prevQuestion">← Προηγούμενη</button><button id="nextQuestion">Επόμενη →</button></div><p id="feedback"></p></section><section id="resultsView" hidden><div class="results-card"><h2>Αποτελέσματα</h2><div class="result-label">Score</div><div id="resultScore" class="result-score"></div><div class="result-label">Ποσοστό επιτυχίας</div><div id="resultPercent" class="result-percent"></div><p id="resultDetails"></p><button id="resultsBack">Επιστροφή στην τράπεζα</button></div></section></main><dialog id="questionDialog"><form method="dialog" id="questionForm"><h3>Ερώτηση</h3><input id="qText" placeholder="Κείμενο ερώτησης" required><input id="qA" placeholder="Απάντηση A" required><input id="qB" placeholder="Απάντηση B" required><input id="qC" placeholder="Απάντηση C"><input id="qD" placeholder="Απάντηση D"><input id="qCorrect" placeholder="Σωστή: A ή A;C" required><textarea id="qExplanation" placeholder="Επεξήγηση"></textarea><div><button value="cancel">Άκυρο</button><button id="saveQuestion" value="default">Αποθήκευση</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
